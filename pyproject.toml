[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlplatform"
version = "3.1.0"
description = "Framework do ecossistema de MLOps no Databricks: features, training, serving e monitoring."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.4",
    "mlflow>=3.15.0",
]

[project.scripts]
mlp-run-feature-table = "mlplatform.entrypoints:run_feature_table"
mlp-generate-resources = "mlplatform.entrypoints:generate_resources"
mlp-generate-bundle = "mlplatform.entrypoints:generate_bundle"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyspark>=3.5",
    "delta-spark>=3.2",
    "databricks-sdk>=0.30",
    "databricks-feature-engineering>=0.7",
]

[tool.setuptools.packages.find]
where = ["src"]
