[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlplatform"
version = "3.3.0"
description = "Framework do ecossistema de MLOps no Databricks: features, training, serving e monitoring."
requires-python = ">=3.11"
# pyspark e delta-spark NÃO entram aqui: o runtime do Databricks já os fornece,
# e declará-los faria o pip instalar uma segunda cópia dentro do job.
#
# databricks-sdk entra: o runtime traz uma versão, mas antiga demais — o módulo
# databricks.sdk.service.database (synced tables do Lakebase) não existe nela, e
# o sync online morre com ModuleNotFoundError. Antes isso era mascarado porque
# cada bundle instalava o SDK pelo seu requirements-dev.txt e o notebook fazia
# %pip install; sem notebook e sem requirements por bundle, quem precisa declarar
# é quem importa.
dependencies = [
    "pandas>=2.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.4",
    "mlflow>=3.15.0",
    "databricks-sdk>=0.30",
]

[project.scripts]
mlp-run-feature-table = "mlplatform.entrypoints:run_feature_table"
mlp-generate-resources = "mlplatform.entrypoints:generate_resources"
mlp-generate-bundle = "mlplatform.entrypoints:generate_bundle"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyspark>=3.5",
    "delta-spark>=3.2",
    "databricks-feature-engineering>=0.7",
]

[tool.setuptools.packages.find]
where = ["src"]
