[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlplatform"
version = "3.5.5"
description = "Framework do ecossistema de MLOps no Databricks: features, training, serving e monitoring."
requires-python = ">=3.11"
# pyspark e delta-spark NÃO entram aqui: o runtime do Databricks já os fornece,
# e declará-los faria o pip instalar uma segunda cópia dentro do job.
#
# databricks-sdk entra: o runtime traz uma versão, mas antiga demais — o módulo
# databricks.sdk.service.database (synced tables do Lakebase) não existe nela, e
# o sync online morre com ModuleNotFoundError. Antes isso era mascarado porque
# cada bundle instalava o SDK pelo seu requirements-dev.txt e o notebook fazia
# %pip install; sem notebook e sem requirements por bundle, quem precisa declarar
# é quem importa.
dependencies = [
    "pandas>=2.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.4",
    "mlflow>=3.15.0",
    # >=0.55, e não >=0.30: databricks.sdk.service.database (synced tables do
    # Lakebase) só existe a partir dessa versão. O serverless já traz um SDK
    # antigo que satisfazia >=0.30, então o pip não atualizava nada e o import
    # continuava falhando — a restrição precisa ser maior que a versão embutida
    # para forçar o upgrade.
    "databricks-sdk>=0.55",
    # Importado pelos adapters de training e serving (create_training_set,
    # log_model, score_batch). O serverless NÃO traz este pacote — o pipeline
    # de treino morria com ModuleNotFoundError no primeiro import, e só
    # apareceu quando o job foi de fato executado. O adapter de features não o
    # usa (grava Delta puro + constraint de PK), por isso aquele componente
    # rodava enquanto estes dois nunca tinham rodado.
    "databricks-feature-engineering>=0.16",
]

[project.scripts]
mlp-run-feature-table = "mlplatform.entrypoints:run_feature_table"
mlp-generate-resources = "mlplatform.entrypoints:generate_resources"
mlp-generate-bundle = "mlplatform.entrypoints:generate_bundle"
mlp-score-batch = "mlplatform.entrypoints:score_batch"
mlp-refresh-endpoint = "mlplatform.entrypoints:refresh_endpoint"
mlp-prepare-training-set = "mlplatform.entrypoints:prepare_training_set"
mlp-fit-and-compare = "mlplatform.entrypoints:fit_and_compare"
mlp-select-test-register = "mlplatform.entrypoints:select_test_register"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyspark>=3.5",
    "delta-spark>=3.2",
    "databricks-feature-engineering>=0.7",
]

[tool.setuptools.packages.find]
where = ["src"]
