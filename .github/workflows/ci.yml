name: CI

on:
  pull_request:
    branches: [main]

jobs:
  ci:
    uses: ViniciusOtoni/mlops-platform/.github/workflows/ci-validate.yml@main
    with:
      working-directory: .
      # Config estrita: adiciona o contrato de arquitetura interna do framework
      # (contextos não se importam entre si, infra só em adapters).
      ruff-config: ruff-framework.toml
    secrets: inherit
