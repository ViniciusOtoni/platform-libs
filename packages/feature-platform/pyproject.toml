[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "feature-platform"
version = "0.1.2"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "pyyaml>=6.0",
    "platform-core @ git+https://github.com/ViniciusOtoni/platform-libs@platform-core-v0.1.0#subdirectory=packages/platform-core",
]

[tool.setuptools.packages.find]
where = ["src"]
